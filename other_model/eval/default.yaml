# 'data_split_mode': 'leave_one_out'  # 或 use_user_split=False
'data_split_mode': 'user_split'  # 或 use_user_split=True
raw_pkl_path: ../../../data/KSID/raw_data_lv.pkl
pid2sid_path: ../../../data/KSID/pid2sid_raw.pkl

um_proc: 1
cache_dir: cache/       # Usually for raw and processed data
log_dir: logs/
tensorboard_log_dir: tensorboard/
ckpt_dir: ckpt/
run_id: genrec_default  # Change this to your customized run id
rand_seed: 2024
reproducibility: True

train_batch_size: 256
eval_batch_size: 32
lr: 0.0003
weight_decay: 0.0
warmup_steps: 10000
steps: ~
epochs: 100
max_grad_norm: 1.0      # None for no clipping, else a float value
eval_interval: 1        # Evaluate every n epochs
patience: 10            # Early stopping. Stop training after n epochs without improvement. Set to None to disable

topk: [1,5,10,20,50]
metrics: [ndcg,recall,mrr]
val_metric: ndcg@10
