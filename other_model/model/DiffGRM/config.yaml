# Config for DIffGM
num_beams: 50         # Number of beams for beam search
max_length: 10        # Maximum length of the generated sequence

num_layers: 4
num_decoder_layers: 4
d_model: 384
d_ff: 1024
num_heads: 6
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"

# Masked Diffusion Configuration
masking_strategy: guided      # random | sequential | guided
guided_refresh_each_step: false 
guided_select: least 
guided_conf_metric: msp 
train_sliding: true 
min_hist_len: 2 
eval_start_epoch: 10 
label_smoothing: 0.15 
force_regenerate_opq: true 
share_decoder_output_embedding: true 


# Normalization
norm_type: layernorm    # 可选: layernorm | rmsnorm
norm_eps: 1e-5          # 建议: RMSNorm=1e-6, LayerNorm=1e-5



presets:
  # ---------------------------------------------------
  # TINY — Debug / 小规模测试
  # Params ≈ 4.5M
  # ---------------------------------------------------
  tiny:
    num_layers: 4              # encoder layers
    num_decoder_layers: 4      # decoder layers
    d_model: 128
    d_ff: 1024
    num_heads: 6               # 4 * 64 = 256
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # SMALL — 官方 T5-Small
  # Params ≈ 60M
  # ---------------------------------------------------
  small:
    num_layers: 6
    num_decoder_layers: 6
    d_model: 512
    d_ff: 1024
    num_heads: 8               # 8 * 64 = 512
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # MEDIUM — 自定义 Medium（介于 small/base 之间）
  # Params ≈ 150M
  # ---------------------------------------------------
  medium:
    num_layers: 8
    num_decoder_layers: 8
    d_model: 768
    d_ff: 2048
    num_heads: 12              # 12 * 64 = 768
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # BASE — 官方 T5-Base
  # Params ≈ 220M
  # ---------------------------------------------------
  base:
    num_layers: 12
    num_decoder_layers: 12
    d_model: 768
    d_ff: 3072
    num_heads: 12              # 12 * 64 = 768
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # LARGE — 官方 T5-Large
  # Params ≈ 770M
  # ---------------------------------------------------
  large:
    num_layers: 24
    num_decoder_layers: 24
    d_model: 1024
    d_ff: 4096
    num_heads: 16              # 16 * 64 = 1024
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # 3B — 官方 T5-3B
  # Params ≈ 3 Billion
  # ---------------------------------------------------
  "3b":
    num_layers: 24
    num_decoder_layers: 24
    d_model: 1536
    d_ff: 6144
    num_heads: 16              # 官方 3B 不严格等于 d_model = heads * d_kv
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # 11B — 官方 T5-11B
  # Params ≈ 11 Billion
  # ---------------------------------------------------
  "11b":
    num_layers: 24
    num_decoder_layers: 24
    d_model: 2048
    d_ff: 8192
    num_heads: 32              # 32 * 64 = 2048
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"