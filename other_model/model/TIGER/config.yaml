# Overwritting configs
metadata: sentence    # Overwrite data config file, TIGER only supports sentence metadata
lr: 0.003             # Overwrite learning rate
weight_decay: 0.05    # Overwrite weight decay

# Config for sentence embedding model
# sent_emb_model: sentence-transformers/sentence-t5-base
# sent_emb_batch_size: 512
# sent_emb_dim: 768
# sent_emb_pca: 128     # -1 means no PCA, otherwise PCA dimension

# Config for RQ
# rq_faiss: True
# faiss_omp_num_threads: 32
# rq_n_codebooks: 3
# rq_codebook_size: 256

# Config for RQ-VAE
# Omit this part if using Faiss instead of training RQ-VAE from scratch
# rqvae_hidden_sizes: [2048,1024,512,256,128]
# rqvae_dropout: 0.0
# rqvae_lr: 0.001
# ravae_batch_size: 2048
# rqvae_epoch: 10000
# rqvae_beta: 0.25
# rqvae_verbose: 500
# rqvae_low_usage_threshold: -1 # reassignment (to low usage entries only) is triggered when there're more than 10 low usage entries, -1 means no reassignment

# Config for TIGER
num_beams: 50         # Number of beams for beam search
# Config for T5
num_layers: 4
num_decoder_layers: 4
d_model: 128
d_ff: 1024
num_heads: 6
d_kv: 64
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"

presets:
  # ---------------------------------------------------
  # TINY: debugging / small-scale tests
  # Params ≈ 4.5M
  # ---------------------------------------------------
  tiny:
    num_layers: 4              # encoder layers
    num_decoder_layers: 4      # decoder layers
    d_model: 128
    d_ff: 1024
    num_heads: 6               # 4 * 64 = 256
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # SMALL: standard T5-Small
  # Params ≈ 60M
  # ---------------------------------------------------
  small:
    num_layers: 6
    num_decoder_layers: 6
    d_model: 512
    d_ff: 1024
    num_heads: 8               # 8 * 64 = 512
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # MEDIUM: custom size between small and base
  # Params ≈ 150M
  # ---------------------------------------------------
  medium:
    num_layers: 8
    num_decoder_layers: 8
    d_model: 768
    d_ff: 2048
    num_heads: 12              # 12 * 64 = 768
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # BASE: standard T5-Base
  # Params ≈ 220M
  # ---------------------------------------------------
  base:
    num_layers: 12
    num_decoder_layers: 12
    d_model: 768
    d_ff: 3072
    num_heads: 12              # 12 * 64 = 768
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # LARGE: standard T5-Large
  # Params ≈ 770M
  # ---------------------------------------------------
  large:
    num_layers: 24
    num_decoder_layers: 24
    d_model: 1024
    d_ff: 4096
    num_heads: 16              # 16 * 64 = 1024
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # 3B: standard T5-3B
  # Params ≈ 3 Billion
  # ---------------------------------------------------
  "3b":
    num_layers: 24
    num_decoder_layers: 24
    d_model: 1536
    d_ff: 6144
    num_heads: 16              # Standard 3B does not strictly require d_model = heads * d_kv
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"

  # ---------------------------------------------------
  # 11B: standard T5-11B
  # Params ≈ 11 Billion
  # ---------------------------------------------------
  "11b":
    num_layers: 24
    num_decoder_layers: 24
    d_model: 2048
    d_ff: 8192
    num_heads: 32              # 32 * 64 = 2048
    d_kv: 64
    dropout_rate: 0.1
    activation_function: "relu"
    feed_forward_proj: "relu"